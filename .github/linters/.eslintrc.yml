plugins:
  - jsonc
# event.canonical.json is the RFC 8785 (JCS) canonical serialization of the
# sample event: its exact bytes are the committed artifact, so it cannot be
# reformatted to satisfy style rules.
ignorePatterns:
  - "examples/event-provenance/event.canonical.json"
overrides:
  - files: "*.json"
    parser: jsonc-eslint-parser
    rules:
      # These are the set of rules that belong to jsonc. For more information,
      # https://ota-meshi.github.io/eslint-plugin-jsonc/rules
      jsonc/comma-dangle:
        - error
      jsonc/indent:
        - error
        - 2
      jsonc/key-name-casing:
        - error
        - camelCase: true
          snake_case: false
          ignores:
            - "^x-"
      jsonc/key-spacing:
        - error
      jsonc/no-dupe-keys:
        - error
